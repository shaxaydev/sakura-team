name: Sakura CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment
        run: |
          bash -n team/deploy/*.sh
          python3 -m py_compile team/deploy/bootstrap.py
          python3 -m json.tool team/deploy/compose.json > /dev/null
          docker compose --env-file team/deploy/validation.env -f team/deploy/compose.json config --quiet
  build:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
          - image: backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - image: admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - image: space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - image: live
            context: .
            dockerfile: apps/live/Dockerfile.live
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/shaxaydev/sakura-team-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy immutable images
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 deploy@213.199.53.241 "deploy $GITHUB_SHA"
      - name: Verify HTTPS
        run: curl --fail --retry 5 --retry-delay 5 https://team.borili.uz/api/instances/ > /dev/null
